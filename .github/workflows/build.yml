name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - name: Unpack project
        run: unzip -q X9TimerAndroid.zip -d proj
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle -p proj assembleDebug --no-daemon
      - name: Rename APK
        run: mv proj/app/build/outputs/apk/debug/app-debug.apk X9Timer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: X9Timer
          path: X9Timer.apk
