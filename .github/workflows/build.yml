name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install Android SDK packages manually
      - name: Install Android SDK
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf unpacked proj
          mkdir -p unpacked proj

          unzip -q X9TimerAndroid.zip -d unpacked

          INNER_ZIP="$(find unpacked -type f -name 'X9TimerAndroid.zip' -print -quit || true)"

          if [[ -n "$INNER_ZIP" ]]; then
            mkdir -p unpacked/inner-project
            unzip -q "$INNER_ZIP" -d unpacked/inner-project
          fi

          SETTINGS_FILE="$(find unpacked -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: Could not find Gradle project."
            find unpacked -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          cp -a "$PROJECT_ROOT"/. proj/

          if [[ ! -f proj/app/build.gradle && ! -f proj/app/build.gradle.kts ]]; then
            echo "ERROR: app/build.gradle is missing."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p proj assembleDebug --no-daemon

      - name: Rename APK
        run: |
          set -euo pipefail

          APK="$(find proj/app/build/outputs/apk -type f -name '*.apk' -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" X9Timer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: X9Timer
          path: X9Timer.apk
          if-no-files-found: error
